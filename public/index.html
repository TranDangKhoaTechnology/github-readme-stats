<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tran Dang Khoa - GitHub Readme Stats</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 900px; width: 100%; padding: 40px 20px; }

    /* Header */
    .header { text-align: center; margin-bottom: 40px; }
    .avatar {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid #30363d;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 2rem; color: #58a6ff; margin-bottom: 8px; }
    .header p { color: #8b949e; font-size: 1.1rem; }

    /* Badges */
    .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
    .badge {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #c9d1d9;
    }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .cards img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* Links */
    .links { display: flex; gap: 16px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
    .links a {
      color: #58a6ff;
      text-decoration: none;
      padding: 8px 20px;
      border: 1px solid #30363d;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .links a:hover { background: #1f6feb22; border-color: #58a6ff; }

    /* Footer */
    .footer { text-align: center; margin-top: 40px; padding: 20px; color: #484f58; font-size: 0.85rem; }
    .footer a { color: #58a6ff; text-decoration: none; }

    /* Section titles */
    h2 { color: #58a6ff; margin: 40px 0 20px; font-size: 1.4rem; text-align: center; }

    /* Repos grid */
    .repo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    .repo-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      text-decoration: none;
      color: #c9d1d9;
      transition: border-color 0.2s;
    }
    .repo-card:hover { border-color: #58a6ff; }
    .repo-card h3 { font-size: 0.95rem; color: #58a6ff; margin-bottom: 6px; }
    .repo-card p { font-size: 0.8rem; color: #8b949e; line-height: 1.4; }

    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      .header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img class="avatar" src="https://github.com/TranDangKhoaTechnology.png" alt="Tran Dang Khoa">
      <h1>👋 Tran Dang Khoa</h1>
      <p>Embedded Systems Engineer & Full-stack Developer</p>
      <div class="badges">
        <span class="badge">🔧 STM32</span>
        <span class="badge">📡 ESP32</span>
        <span class="badge">⚡ Altium Designer</span>
        <span class="badge">🌐 IoT</span>
        <span class="badge">💻 JavaScript</span>
        <span class="badge">🐍 Python</span>
        <span class="badge">🔌 C/C++</span>
      </div>
      <div class="links">
        <a href="https://github.com/TranDangKhoaTechnology">🐙 GitHub</a>
        <a href="https://github.com/TranDangKhoaTechnology?tab=repositories">📦 Repositories</a>
      </div>
    </div>

    <!-- Stats -->
    <h2>📊 GitHub Statistics</h2>
    <div class="cards">
      <img src="/api?username=TranDangKhoaTechnology&show_icons=true&theme=dark&hide_border=true&count_private=true" alt="GitHub Stats">
      <img src="/api/top-langs?username=TranDangKhoaTechnology&layout=compact&theme=dark&hide_border=true" alt="Top Languages">
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Powered by <a href="https://github.com/anuraghazra/github-readme-stats">github-readme-stats</a></p>
      <p style="margin-top: 4px;">✨ Generated dynamically with ❤️</p>
    </div>
  </div>
</body>
</html>
